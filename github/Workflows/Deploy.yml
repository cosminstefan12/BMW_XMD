name: BMW_XMD Bot Runner

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Aducere cod din repo
      uses: actions/checkout@v4

    - name: Setare Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalare dependențe
      run: npm install

    - name: Pornire Bot
      run: node index.js
